# ============================================================================
# dsh-koi —— DSH bundle patch
# ============================================================================
# 插件挂载声明：DSH 启动时把本插件插进 profile 的配置树。
#
# 安装（服务器）：
#   dsh plugin --profile web add "link:/opt/dsh-plugins/dsh-koi"
#
# ⚠️ `name:` 必须与包名完全一致（dsh-koi），否则表现为「装上了但面板 404」。
# 装完后面板入口：Web 界面 →「设置 → 彩票」
# ============================================================================

- insert:
    - id: dsh-koi
      name: dsh-koi
